name: ip-probe
# TEMPORARY: one-off probe for SiteGround support. Manual only; no secrets; no Telegram.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          echo "utc_time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "runner_public_ip: $(curl -s --max-time 15 https://api.ipify.org)"
          curl -s -o /dev/null -D headers.txt --max-time 30 \
            -A "MFC-SiteMonitor/1.0 (+https://github.com/mfc-roadside-assistance/mfc-site-monitor)" \
            https://mfcroadsideassistance.com/ || true
          echo "request_utc_time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "status: $(head -1 headers.txt | tr -d '\r')"
          echo "sg-captcha: $(grep -i '^sg-captcha:' headers.txt | cut -d: -f2- | tr -d ' \r' || true)"
